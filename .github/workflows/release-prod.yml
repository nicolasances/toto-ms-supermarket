name: Production Release

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  release:
    name: Build & Deploy to Cloud Run and GKE
    environment: totolive
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.CICD_SERVICE_ACCOUNT }}

      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PID }}
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Create Environment Variables
        run: |
          PACKAGE_VERSION=$(cat package.json | grep version | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[[:space:]]')
          PACKAGE_NAME=$(cat package.json | grep name | head -1 | awk -F: '{ print $2 }' | sed 's/[",]//g' | tr -d '[[:space:]]')
          IMAGE=europe-west1-docker.pkg.dev/${{ vars.GCP_PID }}/${PACKAGE_NAME}/${PACKAGE_NAME}:${PACKAGE_VERSION}
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Check that the version tag does not exist yet
        run: |
          if OUTPUT=$(gcloud artifacts docker images describe "$IMAGE" 2>&1); then
            echo "::error::Image tag ${PACKAGE_VERSION} already exists. Bump the version in package.json."
            exit 1
          fi

          if echo "$OUTPUT" | grep -qiE 'not found|NOT_FOUND'; then
            echo "Tag ${PACKAGE_VERSION} does not exist yet. Proceeding."
            exit 0
          fi

          echo "::error::Could not check whether the image tag exists:"
          echo "$OUTPUT"
          exit 1

      - name: Build Docker image
        run: docker build . -t "$IMAGE"

      - name: Push Docker image
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.PACKAGE_NAME }} --set-env-vars "HYPERSCALER=gcp,GCP_PID=${{ vars.GCP_PID }},BACKUP_BUCKET=${{ secrets.BACKUP_BUCKET }},SUPITO_API_ENDPOINT=${{ secrets.SUPITO_API_ENDPOINT }},GALE_BROKER_URL=${{ secrets.GALE_BROKER_URL }},SERVICE_BASE_URL=${{ secrets.SERVICE_BASE_URL }}" --service-account=${{ secrets.SERVICE_ACCOUNT }} --project=${{ vars.GCP_PID }} --image="$IMAGE" --platform=managed --region=europe-west1 --allow-unauthenticated

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          project_id: ${{ vars.GKE_PROJECT_ID }}
          cluster_name: ${{ vars.GKE_CLUSTER_NAME }}
          location: ${{ vars.GKE_CLUSTER_LOCATION }}

      - name: Deploy to GKE
        run: |
          kubectl -n ${{ vars.GKE_NAMESPACE }} set image deployment/toto-ms-supermarket toto-ms-supermarket="$IMAGE"
          kubectl -n ${{ vars.GKE_NAMESPACE }} rollout status deployment/toto-ms-supermarket --timeout=5m
